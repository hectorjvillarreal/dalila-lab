# Anexo preliminar del Núcleo 13 — afiliación subsidiada al SEM
# Instrucción: 20261017_BDH_N13_anexo-afiliacion-subsidiada_build_v1.1
# Todas las rutas son relativas a la raíz de Dalila (dalila_root, relativo a esta carpeta).

dalila_root: ../../../../..

inputs:
  informe_pdf: Missions/Funded/IMSS_Surgical/e_1_imss_subsidiado/_informe-situacion-financiera_imss.pdf
  libro_finanzas: "Missions/Funded/IMSS_Surgical/e_1_imss_subsidiado/Req inf fin_Modelo de demanda quirúrgica_070926.xlsx"
  conapo_zip: GrandPlan/DFD/outputs/briefs/2026-09_EIC2025_nota/data/raw/CONAPO_2023_ConDem50a19_ProyPob20a70.zip
  enigh_bundle: Missions/Funded/BID2/motivation/data/enigh/2024/bundle

horizonte:
  anio_base: 2025          # stock observado (dic. 2025)
  anio_inicial: 2026
  anio_final: 2054         # 2055 no se reporta (instrucción 3.5)
  anios_reporte: [2026, 2030, 2040, 2054]

parametros:
  uma_dic2025: 113.14      # pesos/día, Informe Cuadro A.3 nota 2
  uma_2024: 108.57         # pesos/día, Informe Cuadro I.2 nota 1 (pág. PDF 26)
  inflacion_2026: 0.037    # libro, Sup_Fin; lleva pesos de dic. 2025 a pesos de 2026
  cf_patron: 0.2040        # fracción de la UMA, Cuadro A.3
  cf_gf: 0.1483
  excedente: 0.0150        # 1.10 patrón + 0.40 trabajador sobre (SBC − 3 UMA)
  excedente_patron: 0.0110
  umbral_excedente_uma: 3.0
  gmp_privado: 0.01425     # 1.05 patrón + 0.375 trabajador (% del SBC)
  sm_2025: 278.80          # pesos/día, zona general, Informe sección I.1.3
  sbc_crec_uma_2025: 0.026 # SBC en veces UMA: 5.41 → 5.55 (Informe, pág. PDF 23)
  tope_sbc_uma: 25
  dias: 365
  especie_sem_2026: 494275 # mdp de 2026, Cuadro V.13
  dh_total_informe: 79178109  # Cuadro I.4, cierre 2025
  pib_2026: 38715900       # mdp, Informe nota 51
  edad_min_titular: 15
  # v1.2
  dias_cotizados: 337      # Informe, Cuadro II.18
  sm_2024: 248.93          # pesos/día, resto del país; Resolución CONASAMI, DOF 12/12/2023
  hb_informe_titulares: 1.0729   # 40,980,786 familiares / 38,197,323 titulares (Cuadro I.4)
  pef2026_salud_no_contrib_mdp2027: {SSa: 68964.2, IMSS-Bienestar: 177591.9, FASSA: 87344.2, Bienestar: 4128.0}
  inflacion_2027: 0.0382   # libro, Sup_Fin

# Denominador común con el experimento 2 (instrucción 20261018_..._experimento2_build_v1.1, sección 4).
# Solo para las salidas v1.2: puntos del salario sobre la masa R1 (tope 25 UMA, piso SM, 337 días) e
# ingresos del SEM del Informe, Cuadro V.13 (interpolación lineal). El libro se sigue usando para cotizantes,
# salarios y supuestos. Las corridas v1.1 conservan sus denominadores originales.
sem_v13:
  anios: [2026, 2031, 2036, 2041, 2046, 2051, 2055]
  ingresos: [562126, 642375, 740391, 859501, 995073, 1131634, 1215833]

escenarios:
  # Defaults comunes: reproducen la v1.1 (D1, cobro completo, umbrales fijos en UMA, 365 días).
  defaults: {D: D1, rho: 1.0, umbral: fijo, dias: 365, hb: enigh, tau: 0.9, mu: 1.0}
  base: {S: S1, G: G1, U: U1, T: T2, C: C1, F: F0, pi_m: 0.0, perfil: estilizado_3}
  # Instrucción v1.2 (sección 5): D2 · G2 · S1 indexado · U1 · τ 0.50 · ρ 0.75 · μ 1.10 · C1 · F0 · π_m 0 · perfil 3.0 · 337 días
  base_v12: {D: D2, S: S1, G: G2, U: U1, T: fijo, tau: 0.5, mu: 1.10, rho: 0.75, umbral: indexado, dias: 337,
             C: C1, F: F0, pi_m: 0.0, perfil: estilizado_3, hb: enigh}
  S:
    S1: {p0: 20, p1: 50}
    S2: {p0: 10, p1: 30}
    S3: {p0: 40, p1: 70}
  G: [G1, G2]
  U: [U1, U2]
  T:
    T1: {tau0: 0.10, tau1: 0.40, mu1: 0.30}
    T2: {tau: 0.90, mu: 1.0}
    fijo: {}               # usa los parámetros tau y mu del escenario (v1.2)
  C: [C1, C2]
  F:
    F0: {cotizantes_2030: 0}
    F1: {cotizantes_2030: 3000000, anio_inicio: 2026, anio_meta: 2030}
  pi_m: [0.0, 0.01, 0.02]
  perfil:
    plano: {razon_65: 1.0}
    estilizado_2: {razon_65: 2.0}
    estilizado_3: {razon_65: 3.0}
    estilizado_4: {razon_65: 4.0}

# Malla mínima (instrucción, sección 5): cada corrida cambia un solo bloque respecto de la base.
malla:
  - {id: base}
  - {id: S2, S: S2}
  - {id: S3, S: S3}
  - {id: T1, T: T1}
  - {id: G2, G: G2}
  - {id: U2, U: U2}
  - {id: U2_hInforme, U: U2, hb: informe_cotizantes}   # sensibilidad añadida en v1.1: h_b = familiares / cotizantes del Informe
  - {id: pim1, pi_m: 0.01}
  - {id: pim2, pi_m: 0.02}
  - {id: C2, C: C2}
  - {id: F1, F: F1}
  - {id: plano, perfil: plano}
  - {id: estilizado_2, perfil: estilizado_2}
  - {id: estilizado_4, perfil: estilizado_4}

# Malla v1.2 (sección 5): cada corrida cambia un elemento respecto de base_v12.
malla_v12:
  - {id: base}
  - {id: regresion_v11, D: D1, G: G1, T: T2, tau: 0.9, mu: 1.0, rho: 1.0, umbral: fijo, dias: 365}
  - {id: S2, S: S2}
  - {id: S3, S: S3}
  - {id: G1, G: G1}
  - {id: D1, D: D1}
  - {id: tau30, tau: 0.30}
  - {id: tau70, tau: 0.70}
  - {id: tau90, tau: 0.90}       # solo con descuento automático vía impuesto negativo
  - {id: T1, T: T1}
  - {id: rho50, rho: 0.50}
  - {id: rho100, rho: 1.00}
  - {id: mu100, mu: 1.00}
  - {id: mu130, mu: 1.30}
  - {id: U2_enigh, U: U2, hb: enigh}
  - {id: U2_informe, U: U2, hb: informe_titulares}
  - {id: pim1, pi_m: 0.01}
  - {id: pim2, pi_m: 0.02}
  - {id: C2, C: C2}
  - {id: F1, F: F1}
  - {id: plano, perfil: plano}
  - {id: estilizado_2, perfil: estilizado_2}
  - {id: estilizado_4, perfil: estilizado_4}
  - {id: umbral_fijo, umbral: fijo}
  - {id: C2_pim1, C: C2, pi_m: 0.01}   # para el Cuadro X.1 (C1 y C2 lado a lado, saldo con π_m = 1 %)
